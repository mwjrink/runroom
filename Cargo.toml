[package]
name = "runroom"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "runroom"
path = "src/lib.rs"

[[bin]]
name = "runroom"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
nix = { version = "0.31", features = ["fs", "poll", "process", "sched", "signal", "socket", "user"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shell-words = "1.1"
signal-hook = "0.3"
tempfile = "3"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zbus = "5.19"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
